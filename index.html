<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minecrrrr.space — Redirect</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0a0a0f;
        --bg-card: #1a1a24;
        --text: #e8e8ec;
        --text-muted: #8a8a9a;
        --text-dim: #5a5a6a;
        --accent: #c4a47c;
        --accent-glow: rgba(196, 164, 124, 0.15);
        --border: rgba(255, 255, 255, 0.06);
        --border-hover: rgba(196, 164, 124, 0.3);
        --radius: 16px;
        --radius-sm: 10px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        position: relative;
      }

      /* Noise overlay */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.03;
        z-index: 1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }

      /* Glow behind card */
      .glow {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          var(--accent-glow) 0%,
          transparent 70%
        );
        border-radius: 50%;
        animation: pulse 4s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.6;
          transform: scale(1.1);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .card {
        position: relative;
        z-index: 2;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 48px 40px;
        text-align: center;
        max-width: 420px;
        width: 90%;
        animation: fadeUp 0.6s ease forwards;
      }

      .logo {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.1rem;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 32px;
        letter-spacing: -0.5px;
      }
      .logo span {
        color: var(--accent);
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 24px;
      }

      .title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }

      .subtitle {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 32px;
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin-bottom: 24px;
      }

      .lang-label {
        font-size: 0.75rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
      }

      .lang-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .lang-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 24px;
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        color: var(--text-muted);
        background: transparent;
        border: 1px solid var(--border);
        cursor: pointer;
        font-family: inherit;
        transition: all 0.3s ease;
      }
      .lang-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
        background: rgba(255, 255, 255, 0.02);
        transform: translateY(-2px);
      }
      .lang-btn.primary {
        border-color: var(--accent);
        color: var(--accent);
      }
      .lang-btn.primary:hover {
        background: rgba(196, 164, 124, 0.08);
      }

      .flag {
        font-size: 1rem;
      }
    </style>

    <script>
      (function () {
        var userLang = navigator.language || navigator.userLanguage;
        if (userLang.toLowerCase().startsWith("ru")) {
          window.location.replace("./ru/index.html");
        } else {
          window.location.replace("./en/index.html");
        }
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0;url=./en/index.html" />
    </noscript>
  </head>
  <body>
    <div class="glow"></div>

    <div class="card">
      <div class="logo">minecrrrr<span>.space</span></div>

      <div class="spinner"></div>

      <h1 class="title">Redirecting...</h1>
      <p class="subtitle">Detecting your language preference</p>

      <div class="divider"></div>

      <p class="lang-label">Or choose manually</p>

      <div class="lang-buttons">
        <a href="./en/index.html" class="lang-btn">
          <span class="flag"
            ><img
              src="https://hatscripts.github.io/circle-flags/flags/us.svg"
              width="25"
          /></span>
          English
        </a>
        <a href="./ru/index.html" class="lang-btn primary">
          <span class="flag"
            ><img
              src="https://hatscripts.github.io/circle-flags/flags/ru.svg"
              width="25"
          /></span>
          Русский
        </a>
      </div>
    </div>
  </body>
</html>
